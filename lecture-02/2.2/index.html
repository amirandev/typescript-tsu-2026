<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>რეგისტრაცია — TypeScript Forms</title>
</head>
<body>
  <h1>მომხმარებლის რეგისტრაცია</h1>

  <form id="registrationForm">
    <div>
      <label>სრული სახელი:</label>
      <input name="fullName" placeholder="მაგ: ნინო ქართველიშვილი" />
    </div>

    <div>
      <label>ელ-ფოსტა:</label>
      <input name="email" type="email" placeholder="example@mail.com" />
    </div>

    <div>
      <label>პაროლი:</label>
      <input name="password" type="password" placeholder="მინიმუმ 6 სიმბოლო" />
    </div>

    <div>
      <label>გაიმეორეთ პაროლი:</label>
      <input name="confirmPassword" type="password" placeholder="შეიყვანეთ პაროლი კიდევ ერთხელ" />
    </div>

    <div>
      <label>ასაკი:</label>
      <input name="age" type="number" placeholder="18-120" />
    </div>

    <div>
      <label>ქვეყანა:</label>
      <select name="country">
        <option value="">აირჩიეთ ქვეყანა</option>
        <option value="ge">საქართველო</option>
        <option value="us">აშშ</option>
        <option value="uk">გაერთიანებული სამეფო</option>
        <option value="de">გერმანია</option>
      </select>
    </div>

    <div>
      <label>
        <input name="agree" type="checkbox" />
        ვეთანხმები წესებსა და პირობებს
      </label>
    </div>

    <button id="submitBtn" type="submit">რეგისტრაცია</button>
  </form>

  <script src="dist/index.js"></script>
</body>
</html>
