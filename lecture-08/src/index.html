<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TypeScript DOM Lecture — User Directory</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1 data-title="ts-lecture">User Directory</h1>
      <p>TypeScript DOM Manipulation — Lecture Example</p>
    </header>

    <section id="formSection" class="card">
      <h2>Add New User</h2>
      <form id="userForm" class="form-grid">
        <div class="form-group">
          <label for="name">Name</label>
          <input id="name" type="text" placeholder="e.g. John Doe" />
          <span class="field-error" id="nameError"></span>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="e.g. john@example.com" />
          <span class="field-error" id="emailError"></span>
        </div>
        <div class="form-group full-width">
          <label for="role">Role</label>
          <select id="role">
            <option value="viewer">Viewer</option>
            <option value="editor">Editor</option>
            <option value="admin">Admin</option>
          </select>
          <span class="field-error" id="roleError"></span>
        </div>
        <div class="form-group full-width">
          <button type="submit" class="btn btn-primary" id="submitBtn">Add User</button>
        </div>
      </form>
    </section>

    <section id="listSection" class="card">
      <div class="toolbar">
        <input id="searchInput" type="text" placeholder="Search users..." />
        <select id="sortSelect">
          <option value="name">Sort by Name</option>
          <option value="email">Sort by Email</option>
          <option value="role">Sort by Role</option>
          <option value="createdAt">Sort by Date</option>
        </select>
        <button id="sortDirBtn" class="btn btn-sm btn-primary" data-direction="asc">↑ Asc</button>
      </div>
      <div class="stats">
        Total: <span id="totalCount">0</span> &middot;
        Admin: <span id="adminCount">0</span> &middot;
        Editor: <span id="editorCount">0</span> &middot;
        Viewer: <span id="viewerCount">0</span>
      </div>
      <div id="userGrid" class="user-grid">
        <div class="empty-state">
          <p>No users yet. Add one using the form above.</p>
        </div>
      </div>
    </section>
  </div>

  <div id="toast" class="toast"></div>

  <script src="../dist/index.js"></script>
</body>
</html>
